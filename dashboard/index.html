<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDLC Pipeline Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#0b0e13;color:#e6edf3;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
  button{font-family:inherit}
  @keyframes sdlcPulse{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes sdlcRing{0%{box-shadow:0 0 0 0 rgba(34,211,238,.45)}70%{box-shadow:0 0 0 7px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
  @keyframes sdlcDash{to{stroke-dashoffset:-28}}
  @keyframes sdlcSpin{to{transform:rotate(360deg)}}
  @keyframes sdlcFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @keyframes sdlcBlink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes sdlcToastIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
  @keyframes sdlcToastOut{to{opacity:0;transform:translateX(16px)}}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2a323d;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#3a4552}
  ::-webkit-scrollbar-track{background:transparent}
  a{color:#4f9dff;text-decoration:none}
  a:hover{color:#7ab4ff;text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { deriveModel, parseNdjson, fmtDur, fmtCost, STAGES, ALL_STAGES, COLORS, CAP } from './derive.mjs';

// ============================================================================
//  SDLC Pipeline Dashboard — vanilla rebuild of the DCLogic prototype, wired
//  to the real pipeline artifacts served under /data/. All view-model math
//  lives in ./derive.mjs (imported, never re-implemented here); this file is
//  purely: fetch -> deriveModel -> render DOM -> repeat every 1.5s.
// ============================================================================

const ACCENT = '#4f9dff';
const REAL_STAGES = STAGES.filter(s => !s.planned);   // 6 writing-flow stages
const PRODUCT_COLOR = '#22d3ee';                       // single product per install

// ---------- small helpers ----------------------------------------------------
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function basename(p) {
  return String(p || '').replace(/[\\/]+$/, '').split(/[\\/]/).pop() || '—';
}
// Job ids are either short pipeline ticket numbers (e.g. 002) or 24-char Mongo
// ObjectIds. The narrow ID columns are sized for the former; clip the latter to a
// short prefix (full id stays in the title tooltip + the detail view) so it can't
// overflow its cell and overlap the title next to it.
function shortId(id) { id = String(id ?? ''); return id.length > 12 ? id.slice(0, 8) + '…' : id; }
// A human title for a job that has no ticket .md yet: the fetched context's
// portal + top Sentry error (what's actually being debugged), so the Title
// column carries real info instead of duplicating the id as "Job <id>".
function contextTitle(ctx) {
  if (!ctx) return '';
  const m = ctx.mongo || {};
  const err = (ctx.sentry || []).flatMap(s => (s.events || []).map(e => e && e.title)).find(Boolean);
  const portal = m.portalName || '';
  let t = '';
  if (portal && err) t = portal + ' · ' + err;
  else if (err) t = err;
  else if (portal && m.customerName) t = portal + ' — ' + m.customerName;
  else t = portal || m.customerName || '';
  return t.length > 80 ? t.slice(0, 79) + '…' : t;
}

const statusMeta = s => ({
  running: { label: 'Running',                color: COLORS.running },
  waiting: { label: 'Waiting approval',       color: COLORS.waiting },
  done:    { label: 'Done · fix reviewed',    color: COLORS.done },
  blocked: { label: 'Blocked · needs human',  color: COLORS.blocked },
}[s] || { label: 'In progress', color: '#8b98a5' });

const gateMeta = g => ({
  soft: { tag: 'APPROVE', color: '#c08a3e' },
  hard: { tag: 'GATE',    color: '#3f8ea0' },
}[g] || { tag: 'AUTO', color: '#5b6673' });

// check-kind colors, per the model contract
const KIND = { pass: '#34d399', fail: '#fb7185', infra: '#f5b83d', na: '#4a545f' };

// generic kind color used by obs tiles / belt / outcome
const kindColor = k => ({
  done: COLORS.done, blocked: COLORS.blocked, waiting: COLORS.waiting,
  failed: COLORS.failed, running: COLORS.running, todo: '#8b98a5', na: '#4a545f',
}[k] || '#8b98a5');


const STAGE_STATE_LABEL = {
  todo: 'not reached', running: 'running', waiting: 'awaiting approval',
  done: 'passed', failed: 'rejected', planned: 'planned', skipped: 'skipped',
};

const dotAnim = state => state === 'running' ? 'sdlcPulse 1.5s ease-in-out infinite' : 'none';

function pill(status) {
  const m = statusMeta(status);
  return `display:inline-flex;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.2px;padding:2px 9px;border-radius:20px;color:${m.color};background:${m.color}1a;border:1px solid ${m.color}44;white-space:nowrap`;
}

// ---------- markdown renderer (vanilla port of the design's parseMd) ----------
function mdInline(text) {
  const re = /(\*\*([^*]+)\*\*|`([^`]+)`)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index));
    if (m[2] != null) out += `<strong style="color:#f0f5fa;font-weight:600">${esc(m[2])}</strong>`;
    else out += `<code style="font-family:'IBM Plex Mono',monospace;font-size:12px;background:#12171d;border:1px solid #232b34;border-radius:4px;padding:1px 5px;color:#7fd6e6">${esc(m[3])}</code>`;
    last = re.lastIndex;
  }
  out += esc(text.slice(last));
  return out;
}
function cellColor(txt) {
  const t = txt.trim().toUpperCase();
  if (t === 'PASS' || t === 'SHIP') return '#34d399';
  if (t.includes('FAIL') || t === 'NO-SHIP') return '#fb7185';
  if (t.includes('INFRA')) return '#f5b83d';
  return '#c9d4de';
}
function parseMd(src) {
  if (!src) return '';
  const lines = src.split('\n'); const out = []; let i = 0;
  while (i < lines.length) {
    let line = lines[i];
    if (!line.trim()) { i++; continue; }

    // fenced code block (real specs use ```ts ... ```) — enhancement over the mock
    if (/^```/.test(line.trim())) {
      i++; const code = [];
      while (i < lines.length && !/^```/.test(lines[i].trim())) { code.push(lines[i]); i++; }
      i++; // skip closing fence
      out.push(`<pre style="margin:8px 0 14px;padding:12px 14px;background:#0c1016;border:1px solid #1c232c;border-radius:8px;overflow:auto"><code style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#a7d9c9;line-height:1.55">${esc(code.join('\n'))}</code></pre>`);
      continue;
    }
    // Headings #..###### — renderContextMarkdown emits #### per Sentry event
    // title, so >3 hashes MUST be handled; an unhandled #### used to fall to the
    // paragraph branch and hang the tab (see the always-advance guard below).
    // Levels 1-3 keep the original styling; 4-6 render as a compact h4. A bare
    // "#text" with no space is not a heading and correctly falls through.
    {
      const hm = /^(#{1,6}) +(.+)$/.exec(line);
      if (hm) {
        const [tag, css] = ({
          1: ['h2', 'margin:2px 0 10px;font-size:17px;font-weight:700;color:#f0f5fa;line-height:1.3'],
          2: ['h3', 'margin:20px 0 8px;font-size:15px;font-weight:600;color:#e6edf3'],
          3: ['h4', 'margin:18px 0 6px;font-size:13px;font-weight:600;color:#dbe4ec;letter-spacing:.2px'],
        })[hm[1].length] || ['h4', 'margin:14px 0 5px;font-size:12.5px;font-weight:600;color:#c4cdd6;letter-spacing:.2px'];
        out.push(`<${tag} style="${css}">${mdInline(hm[2])}</${tag}>`); i++; continue;
      }
    }
    if (/^---+$/.test(line.trim())) { out.push(`<hr style="border:none;border-top:1px solid #1c232c;margin:16px 0">`); i++; continue; }

    if (/^\|/.test(line)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      const cells = r => r.split('|').slice(1, -1).map(c => c.trim());
      const header = cells(rows[0]); const body = rows.slice(2).map(cells);
      const th = header.map(h => `<th style="text-align:left;padding:7px 11px;background:#12171d;border:1px solid #232b34;color:#8b98a5;font-weight:600;font-size:11px;letter-spacing:.3px;text-transform:uppercase">${mdInline(h)}</th>`).join('');
      const tb = body.map(r => '<tr>' + r.map((c, ci) => {
        const col = ci > 0 ? cellColor(c) : '#c9d4de';
        const fam = ci > 0 ? "'IBM Plex Mono',monospace" : 'inherit';
        const fw = ci > 0 ? 600 : 400;
        return `<td style="padding:7px 11px;border:1px solid #1c232c;font-family:${fam};color:${col};font-weight:${fw}">${mdInline(c)}</td>`;
      }).join('') + '</tr>').join('');
      out.push(`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:12.5px"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`);
      continue;
    }
    if (/^\s*[-*] /.test(line)) {
      const items = []; while (i < lines.length && /^\s*[-*] /.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*] /, '')); i++; }
      out.push(`<ul style="margin:4px 0 12px;padding-left:20px;color:#c2cdd7">${items.map(it => `<li style="margin:4px 0">${mdInline(it)}</li>`).join('')}</ul>`);
      continue;
    }
    // paragraph — consume >=1 line up front so i ALWAYS advances; an unhandled
    // prefix (e.g. a heading level we don't special-case) can never infinite-loop.
    const para = [lines[i++]];
    while (i < lines.length && lines[i].trim() && !/^(#|\||```|\s*[-*] |---)/.test(lines[i])) { para.push(lines[i]); i++; }
    out.push(`<p style="margin:6px 0 10px;color:#b8c3cd">${mdInline(para.join(' '))}</p>`);
  }
  return out.join('');
}

// ============================================================================
//  STATE + DATA
// ============================================================================
const state = {
  view: 'tickets', detailId: null, shotsOpen: {},
  // control-plane UI state (all survive the 1.5s morph repaint because they live
  // in state, not the DOM): the header "Debug a job" box, and per-pause approval.
  debugJobId: '', debugMsg: '', debugOpen: false,   // the "Debug a job" modal
  feedbackDraft: {},   // "<ticket>__<stage>" -> reject feedback text (bound via input listener)
  rejectOpen: {},      // "<ticket>__<stage>" -> whether the reject textarea is revealed
  decision: {},        // "<ticket>__<stage>" -> { busy:boolean, msg:string } optimistic submit state
  consoleLog: {},      // id -> tailed text of logs/<id>.log (the live console pane)
  consoleStick: true,  // keep the console auto-scrolled to the bottom (false once you scroll up)
  modalStage: null,    // pipeline cube -> open stage modal (a stage key, or null)
  modalTab: 'output',  // the open modal's tab: 'output' (confirm + artifact) | 'kb'
  ctxOpen: {},         // id -> whether the Debug-context panel's full context.md is expanded
  pwReq: {},           // id -> the parsed <id>__password.request.json when the run needs the portal password
  pwDraft: '', pwMsg: '', pwBusy: false, // the masked portal-password field
};

let model = {
  now: Date.now(), tickets: [],
  topStats: { running: 0, waiting: 0, blocked: 0, done: 0, cases: 0 },
  activity: [], gateResults: [],
  obs: { tiles: [], stageAgg: [], beltHot: [] },
};
let productName = '—';

let config = null, configFetched = false;
const titleCache = new Map();      // id -> { title, branch }
const artifactCache = new Map();   // "tabKey/id" -> { status:'ok'|'missing', body }
const contextCache = new Map();    // id -> parsed context.json | null (fetched, absent)
const prefetched = new Set();      // ids we've kicked a full artifact prefetch for
const requestCache = new Map();    // promptId -> approvals/<t>__<s>.request.json (control plane)
const previewCache = new Map();    // promptId -> the pause's produced-output preview text
const toastedPrompts = new Set();  // promptIds we've already raised an approval toast for
let toastsSeeded = false;          // first poll seeds the set so pre-load pauses don't all fire

// Each artifact tab builds its own URL — most are /data/<dir>/<id>.md, but the
// fetched debug context lives in a per-job subfolder (context/<id>/...).
const TABS = [
  { key: 'investigate', label: 'Investigation', path: id => `/data/tickets/${id}.md` },
  { key: 'context',     label: 'Context',       path: id => `/data/context/${id}/context.md` },
  { key: 'reproduce',   label: 'Reproduce',     path: id => `/data/context/${id}/reproduce.md` },
  { key: 'spec',        label: 'Spec',          path: id => `/data/specs/${id}.md` },
  { key: 'review',      label: 'Review',        path: id => `/data/reviews/${id}.md` },
  { key: 'qa',          label: 'QA',            path: id => `/data/qa/${id}.md` },
  { key: 'retro',       label: 'Retro',         path: id => `/data/retros/${id}.md` },
  { key: 'case',        label: 'Case',          path: id => `/data/curator/${id}.md` },
];
const MISS_NOTE = {
  investigate: 'No investigation yet — run `fetch` then the investigate stage.',
  context: 'No fetched context — run `npm run sdlc fetch <jobId>` (or `debug`).',
  reproduce: 'No reproduction captured — the reproduce stage was declined, or has not run.',
  spec:   'The spec stage has not produced output yet.',
  review: 'The review stage has not produced output yet.',
  qa:     'The QA gate has not written a summary yet.',
  retro:  'No retrospective has been written for this job yet.',
  case:   'The curator has not proposed a Case yet — it runs after review, when learning is enabled.',
};
// Which pipeline STAGE (a cube in the overview) maps to which artifact TAB — i.e.
// the output file a stage's modal shows. Stages absent here (implement/test/qa)
// write no local artifact; their modal shows a note + the stage's live status.
const STAGE_TAB = {
  reproduce: 'reproduce',
  investigate: 'investigate',
  spec: 'spec',
  review: 'review',
  qa: 'qa',
  retrospector: 'retro',
  'curator-product': 'case',
};

async function fetchText(url) { try { const r = await fetch(url); return r.ok ? await r.text() : ''; } catch { return ''; } }
async function fetchJson(url) { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch { return null; } }
// The ONE write path to the pipeline: POST /command (start a run, or approve/reject
// a paused stage). The x-sdlc-dashboard header + same-origin localhost gate the
// server enforces; here we just send JSON and hand back {status, json}.
async function postCommand(bodyObj) {
  try {
    const res = await fetch('/command', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-sdlc-dashboard': '1' },
      body: JSON.stringify(bodyObj),
    });
    return { status: res.status, json: await res.json().catch(() => null) };
  } catch { return { status: 0, json: null }; }
}

function stripNum(s) { return s.replace(/^\d+\s*[·:]\s*/, ''); }
function extractTitle(md, id) {
  if (md) {
    const h = md.match(/^#{1,6}\s+(.+)$/m);
    if (h) return stripNum(h[1].trim());
    const first = md.split('\n').map(l => l.trim()).find(Boolean);
    if (first) return stripNum(first);
  }
  return 'Job ' + id;
}

async function fetchArtifact(tab, id) {
  try {
    const r = await fetch(tab.path(id));
    return r.ok ? { status: 'ok', body: await r.text() } : { status: 'missing' };
  } catch { return { status: 'missing' }; }
}
async function loadArtifact(tab, id) {
  const key = tab.key + '/' + id;
  if (artifactCache.has(key)) return artifactCache.get(key);
  const rec = await fetchArtifact(tab, id);
  artifactCache.set(key, rec);
  return rec;
}
// The fetched context.json is structured (Mongo + Sentry + downloaded artifact
// paths) — the Debug-context panel uses it to render the screenshot + a summary.
async function loadContext(id) {
  if (contextCache.has(id)) return contextCache.get(id);
  const json = await fetchJson('/data/context/' + id + '/context.json');
  contextCache.set(id, json); // null when absent
  return json;
}
// A paused stage's request.json carries { question, previewPath, promptId, … }.
// Cached per promptId (a new pause mints a new promptId, so this never goes stale);
// a transient null/absent is NOT cached, so we keep retrying until it lands.
async function loadRequest(id, stage, promptId) {
  if (requestCache.has(promptId)) return requestCache.get(promptId);
  try {
    const r = await fetch('/data/approvals/' + id + '__' + stage + '.request.json');
    // A 404 means the request file is GONE — the pause was already settled and
    // cleaned up (or the run died). request.json is always written BEFORE the
    // awaiting_approval event, so a 404 for a "waiting" stage reliably means
    // "resolved". Cache null so we stop retrying and the UI suppresses the now-
    // defunct Approve/Reject controls instead of showing "loading…" forever.
    if (r.status === 404) { requestCache.set(promptId, null); return null; }
    if (!r.ok) return undefined;            // transient — retry next poll, don't cache
    const json = await r.json();
    requestCache.set(promptId, json);
    return json;
  } catch { return undefined; }             // transient
}
// The produced-output preview for a pause, at the repo-root-relative previewPath
// from its request.json (served under /data/). Cached per promptId; empty not cached.
async function loadPreview(promptId, previewPath) {
  if (previewCache.has(promptId)) return previewCache.get(promptId);
  const body = await fetchText('/data/' + previewPath);
  if (body) previewCache.set(promptId, body);
  return body;
}
async function prefetchAll(id) {
  if (prefetched.has(id)) return;
  prefetched.add(id);
  await Promise.all([...TABS.map(t => loadArtifact(t, id)), loadContext(id)]);
  rerender();
}
// The cache above is write-once — right for a finished job, but it froze the tabs
// at whatever existed when the detail view first opened. This RE-fetches the open
// job's artifacts each poll, so each file shows up as its agent writes it. Returns
// true only when something actually changed, so the caller repaints on real updates.
async function refreshOpenArtifacts(id) {
  if (!id) return false;
  let changed = false;
  await Promise.all(TABS.map(async t => {
    const rec = await fetchArtifact(t, id);
    const key = t.key + '/' + id;
    const prev = artifactCache.get(key);
    if (!prev || prev.status !== rec.status || prev.body !== rec.body) {
      artifactCache.set(key, rec);
      changed = true;
    }
  }));
  // context.json can appear mid-run (after fetch). Re-fetch while we don't have it.
  if (!contextCache.get(id)) {
    const json = await fetchJson('/data/context/' + id + '/context.json');
    if (json) { contextCache.set(id, json); changed = true; }
  }
  return changed;
}

// ---------- the poll ----------
async function refresh() {
  const [evText, rlText] = await Promise.all([
    fetchText('/data/events.jsonl'),
    fetchText('/data/runlog.jsonl'),
  ]);
  const events = parseNdjson(evText);
  const runlog = parseNdjson(rlText);

  if (!configFetched) { config = await fetchJson('/data/sdlc.config.json'); configFetched = true; }

  // product name for the header
  const runStarted = events.find(e => e.type === 'run_started' && e.product);
  if (runStarted) productName = runStarted.product;
  else if (config && config.project && config.project.productPath) productName = basename(config.project.productPath);
  else productName = '—';

  // build meta: unique ticket ids across both sources
  const ids = [...new Set([...runlog, ...events].map(e => e && e.ticket).filter(Boolean).map(String))];
  const meta = {};
  await Promise.all(ids.map(async id => {
    if (!titleCache.has(id)) {
      const md = await fetchText('/data/tickets/' + id + '.md');
      // A ticket .md heading is the best title; store '' when there's none so we
      // fall back to a context-derived title (below) rather than "Job <id>".
      const t = md.trim() ? extractTitle(md, id) : '';
      const mdTitle = (t && t !== 'Job ' + id) ? t : '';
      const implEnt = runlog.find(e => String(e.ticket) === id && e.stage === 'implement' && e.branch);
      const branch = (implEnt && implEnt.branch) || ('feature/' + id);
      titleCache.set(id, { mdTitle, branch });
    }
    const cached = titleCache.get(id);
    // Ensure context.json is loaded (cached) so a job with no ticket .md still
    // gets a real title from its portal + Sentry error, not "Job <id>".
    const ctx = await loadContext(id);
    const title = cached.mdTitle || contextTitle(ctx) || ('Job ' + id);
    meta[id] = { title, branch: cached.branch, config };
  }));

  model = deriveModel({ runlog, events, meta, now: Date.now() });
  notifyApprovals(); // bottom-right toast on each new approval pause

  // Default the detail selection to the newest job, but NEVER override a detailId
  // the user (or a just-started run) already pinned — even one not yet in the model
  // (a freshly started job renders from a placeholder until its first event lands).
  if (model.tickets.length && !state.detailId) state.detailId = model.tickets[0].id;

  // Tail the live console + the portal-password prompt for the active run (and the
  // open detail job, so you can scroll back through a finished run's output). Updates
  // state only; computeSig folds these in, so maybeRender() repaints when they change.
  await refreshConsole(model);

  // Keep the open detail view's artifacts live as agents finish. Only the one
  // open ticket is polled; a real change forces a repaint even when the model
  // signature (events/runlog) is otherwise unchanged.
  if (state.view === 'detail' && state.detailId && await refreshOpenArtifacts(state.detailId)) {
    rerender();
    return;
  }
  maybeRender();
}

// Poll logs/<id>.log for the active run and the open detail job, plus the active
// run's <id>__password.request.json (only the running job can be awaiting one).
async function refreshConsole(model) {
  const active = model.tickets.find(t => t.status === 'running' || t.status === 'waiting');
  const ids = new Set();
  if (active) ids.add(active.id);
  if (state.view === 'detail' && state.detailId) ids.add(state.detailId);
  for (const id of ids) {
    const text = await fetchText('/data/logs/' + id + '.log');
    if (state.consoleLog[id] !== text) state.consoleLog[id] = text;
  }
  // Portal-password prompt — request file present only while the run blocks on it.
  const want = active ? active.id : null;
  const req = want ? await fetchJson('/data/approvals/' + want + '__password.request.json') : null;
  for (const k of Object.keys(state.pwReq)) if (k !== want) delete state.pwReq[k];
  if (want && req) state.pwReq[want] = req; else if (want) delete state.pwReq[want];
}

// ============================================================================
//  RENDER
// ============================================================================
function buildShell() {
  document.getElementById('app').innerHTML = `
  <div style="display:flex;flex-direction:column;height:100vh;min-height:600px;overflow:hidden;background:#0b0e13">
    <header style="display:flex;align-items:center;gap:20px;padding:0 18px;height:56px;flex:0 0 auto;background:#0e1218;border-bottom:1px solid #1c232c;z-index:20">

function onInput(e) {
  const t = e.target;
  if (!t) return;
  if (t.id === 'debugInput') {
    state.debugJobId = t.value;
    if (state.debugMsg) { state.debugMsg = ''; const m = document.getElementById('debugMsg'); if (m) m.textContent = ''; }
    return;
  }
  if (t.id === 'pwInput') {
    state.pwDraft = t.value;
    if (state.pwMsg) { state.pwMsg = ''; const m = document.getElementById('pwMsg'); if (m) m.textContent = ''; }
    return;
  }
  const fb = t.getAttribute && t.getAttribute('data-fb');
  if (fb != null) state.feedbackDraft[fb] = t.value;
}

// The "Debug a job" modal lives outside #main (never morphed): toggle its
// visibility and sync the input value + message from state each render, so
// value-binding survives the 1.5s poll repaint and the cursor never jumps.
function renderDebugModal() {
  const overlay = document.getElementById('debugModal');
  if (!overlay) return;
  overlay.style.display = state.debugOpen ? 'flex' : 'none';
  const di = document.getElementById('debugInput');
  if (di && document.activeElement !== di && di.value !== state.debugJobId) di.value = state.debugJobId;
  const msg = document.getElementById('debugMsg');
  if (msg && msg.textContent !== state.debugMsg) msg.textContent = state.debugMsg;
}
function openDebugModal(open) {
  state.debugOpen = open;
  state.debugMsg = '';
  renderDebugModal();
  if (open) { const di = document.getElementById('debugInput'); if (di) { di.focus(); di.select(); } }
}
// Esc closes the modal; Enter in the job-id field starts the run; Enter in the
// portal-password field sends it to the run (works on any view, so it's first).
function onKey(e) {
  if (e.key === 'Enter' && e.target && e.target.id === 'pwInput') { e.preventDefault(); submitPassword(); return; }
  if (e.key === 'Escape' && state.modalStage) { state.modalStage = null; rerender(); return; }
  if (!state.debugOpen) return;
  if (e.key === 'Escape') openDebugModal(false);
  else if (e.key === 'Enter' && e.target && e.target.id === 'debugInput') { e.preventDefault(); debugStart(); }
}
// The Abort button (header) is shown only while a run is live — a stage is
// running or waiting. It lives outside #main, so toggle it imperatively each render.
function renderAbort() {
  const b = document.getElementById('abortBtn');
  if (!b) return;
  const active = (model.topStats.running || 0) > 0 || (model.topStats.waiting || 0) > 0;
  b.style.display = active ? 'inline-flex' : 'none';
}
// Force-stop the in-progress run: the server tree-kills it via run.lock.json's pid.
async function abortRun() {
  if (!window.confirm('Abort the running pipeline? This force-kills the run process and its headed browser.')) return;
  await postCommand({ cmd: 'abort' }); // next poll picks up run_finished(aborted); the cut-off stage flips to failed
}

// The active run's portal-password request, if any (one run at a time, so ≤1).
function activePwReq() {
  const id = Object.keys(state.pwReq)[0];
  return id ? { id, req: state.pwReq[id] } : null;
}
// The portal-password prompt lives OUTSIDE #main (a fixed bottom banner), so it's
// visible on ANY view while a run is blocked on it. Shown when the active run wrote
// its <id>__password.request.json; the value goes browser -> server -> the run's
// stdin, never to a file. Value/message are synced FROM state so the 1.5s morph
// never wipes in-progress keystrokes (same trick as the debug box).
function renderPasswordBar() {
  const bar = document.getElementById('pwBar');
  if (!bar) return;
  const active = activePwReq();
  bar.style.display = active ? 'block' : 'none';
  if (!active) { if (!state.pwBusy) { state.pwDraft = ''; state.pwMsg = ''; } return; }
  const q = document.getElementById('pwQuestion');
  const qt = (active.req && active.req.question)
    ? active.req.question + ' — the headed browser is open; enter the password to continue.'
    : 'Enter the portal password to continue the reproduction.';
  if (q && q.textContent !== qt) q.textContent = qt;
  const inp = document.getElementById('pwInput');
  if (inp && document.activeElement !== inp && inp.value !== state.pwDraft) inp.value = state.pwDraft;
  const msg = document.getElementById('pwMsg');
  if (msg && msg.textContent !== state.pwMsg) msg.textContent = state.pwMsg;
}
// Hand the portal password to the run: POST /command {cmd:'password'}; the server
// writes it to the run's stdin. On success the run consumes it and removes the
// request file, so the next poll hides this bar.
async function submitPassword() {
  const active = activePwReq();
  if (!active || state.pwBusy) return;
  const password = state.pwDraft;
  if (!password) { state.pwMsg = 'Enter the portal password.'; renderPasswordBar(); return; }
  state.pwBusy = true; state.pwMsg = 'sending…'; renderPasswordBar();
  const promptId = active.req && active.req.promptId;
  const { status, json } = await postCommand({ cmd: 'password', jobId: active.id, promptId, password });
  state.pwBusy = false;
  if (status === 200) {
    state.pwDraft = ''; state.pwMsg = 'sent — the run is continuing.';
    const inp = document.getElementById('pwInput'); if (inp) inp.value = '';
  } else if (status === 409) state.pwMsg = (json && json.error) || 'the run is no longer waiting for a password';
  else if (status === 0) state.pwMsg = 'could not reach the server';
  else state.pwMsg = (json && json.error) || ('error ' + status);
  renderPasswordBar();
}
// Keep the live console pinned to the newest line unless you've scrolled up to read
// back. Runs after each paint; the morph preserves the <pre> node (and its scrollTop),
// so we only re-pin when "stuck". The scroll listener is attached once.
function syncConsole() {
  const el = document.getElementById('sdlcConsole');
  if (!el) return;
  if (!el.dataset.bound) {
    el.dataset.bound = '1';
    el.addEventListener('scroll', () => {
      state.consoleStick = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    });
  }
  if (state.consoleStick) el.scrollTop = el.scrollHeight;
}

// A passive bottom-right toast — raised to NOTIFY when a stage newly pauses for your
// approval (the actual approve/reject happens in the stage's cube modal). Auto-
// dismisses; lives outside #main so the 1.5s poll morph never touches it.
function showToast(msg) {
  const host = document.getElementById('toasts');
  if (!host) return;
  const el = document.createElement('div');
  el.style.cssText = 'max-width:320px;display:flex;align-items:flex-start;gap:9px;padding:11px 14px;border-radius:10px;background:#141019;border:1px solid #3a2a55;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:sdlcToastIn .22s ease';
  el.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${COLORS.waiting};flex:0 0 auto;margin-top:4px;animation:sdlcPulse 1.5s ease-in-out infinite"></span><span style="font-size:12.5px;color:#e6edf3;line-height:1.45">${esc(msg)}</span>`;
  host.appendChild(el);
  const kill = () => { el.style.animation = 'sdlcToastOut .3s ease forwards'; setTimeout(() => el.remove(), 320); };
  setTimeout(kill, 6000);
}
// Raise a toast for every NEW current-run approval pause. Seeds on the first poll so
// pre-existing pauses (from before the page loaded) don't all fire at once.
function notifyApprovals() {
  const waiting = [];
  for (const t of model.tickets) for (const s of STAGES) {
    const st = t.stages[s.key];
    if (st && st.state === 'waiting' && st.promptId) waiting.push({ id: t.id, label: st.label || s.key, promptId: st.promptId });
  }
  if (!toastsSeeded) { for (const w of waiting) toastedPrompts.add(w.promptId); toastsSeeded = true; return; }
  for (const w of waiting) {
    if (toastedPrompts.has(w.promptId)) continue;
    toastedPrompts.add(w.promptId);
    showToast(`${w.label} needs your approval — job #${shortId(w.id)}`);
  }
}

// The pipeline overview — the horizontal stage nodes + the review→implement
// feedback belt — shown at the TOP of a job's detail view (it used to be the
// overview's hero card). Nodes cover the writing stages PLUS the post-run LEARNING
// tail (Retro, Curator). Pass/fail status lives on STAGES in derive.mjs; the
// learning nodes are informational (they render their own live state).
function renderPipelineBar(sel) {
  const nodes = ALL_STAGES.map(st => {
    const s = sel.stages[st.key] || { state: 'todo', attempts: 0, durationMs: null };
    const isLearning = st.gate === 'learn';
    const skipped = s.state === 'skipped';
    const col = COLORS[s.state] || COLORS.todo;
    const gm = gateMeta(st.gate);
    const active = s.state !== 'todo' && !skipped;
    const gateTagColor = skipped ? COLORS.skipped : (isLearning ? COLORS.blocked : gm.color);
    const gateTag = skipped ? 'OFF' : (isLearning ? 'LEARN' : gm.tag);
    const durationLabel = (s.state === 'todo' || skipped) ? '—' : fmtDur(s.durationMs);
    const stateLabel = STAGE_STATE_LABEL[s.state] || s.state;
    const attemptsLabel = s.attempts > 1
      ? `<span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:#c084fc;background:#1e1630;border:1px solid #3a2a55;border-radius:5px;padding:1px 5px">×${s.attempts}</span>`
      : '';
    const boxBg = active ? col + '12' : '#0c1016';
    const boxBorder = active ? col + '40' : '#1a2029';
    const opacity = skipped ? 'opacity:.55;' : '';
    const barBg = `${gateTagColor}${st.gate === 'hard' ? '' : 'aa'}`;
    const title = skipped
      ? (isLearning ? 'Learning loop is off (learning.enabled:false) — not run' : 'Disabled in sdlc.config.json (enabled:false) — this stage is skipped')
      : 'Click to open — output, approval, and knowledge base';
    return `<div data-act="stage" data-stage="${esc(st.key)}" title="${title}" style="position:relative;overflow:hidden;padding:11px 12px 12px 14px;border-radius:10px;background:${boxBg};border:1px solid ${boxBorder};min-height:96px;cursor:pointer;${opacity}">
      <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${barBg}"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.5px;font-weight:600;color:${gateTagColor}">${gateTag}</span>${attemptsLabel}
      </div>
      <div style="display:flex;align-items:center;gap:7px;margin-top:9px">
        <span style="width:9px;height:9px;border-radius:50%;background:${col};flex:0 0 auto;animation:${dotAnim(s.state)}"></span>
        <span style="font-size:13px;font-weight:600;color:#dbe4ec">${esc(st.label)}</span>
      </div>
      <div style="margin-top:6px;font-size:11px;color:${col};font-weight:500">${esc(stateLabel)}</div>
      <div style="margin-top:2px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b7682">${esc(durationLabel)}</div>
      ${s.activeDetail ? `<div style="margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:${COLORS.running};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:sdlcBlink 1.6s ease-in-out infinite">▸ ${esc(s.activeDetail)}</div>` : ''}
    </div>`;
  }).join('');

  // feedback belt geometry — from the actual node indices (review → implement)
  const nStages = ALL_STAGES.length;
  const idxImpl = ALL_STAGES.findIndex(s => s.key === 'implement');
  const idxReview = ALL_STAGES.findIndex(s => s.key === 'review');
  const xImpl = ((idxImpl < 0 ? 0 : idxImpl) + 0.5) / nStages * 1000;
  const xFrom = ((idxReview < 0 ? nStages - 1 : idxReview) + 0.5) / nStages * 1000;
  const beltActive = sel.beltLoops > 0;
  const beltStroke = beltActive ? COLORS.blocked : '#2a323d';
  const beltAnim = beltActive ? 'animation:sdlcDash 1.1s linear infinite' : '';
  const beltText = beltActive ? ('back to Implement · ×' + sel.beltLoops) : 'belt idle';
  const badgeLeft = ((xImpl + xFrom) / 2 / 1000 * 100).toFixed(1);

// The in-tab control-plane block: when the stage behind the active artifact tab
// is paused awaiting approval, render (at the top of the tab) the produced-output
// preview + Approve/Reject. reproduce is special: Approve/Reject only, no preview,
// no feedback. All model text goes through esc()/parseMd — no raw-HTML sink.
// The Approve/Reject (or reproduce y/n) control for a stage that is paused waiting
// for a human. Called from the stage modal with the stage key directly; returns ''
// unless that stage is currently "waiting" with a live promptId.
function renderApproval(sel, stage) {
  if (!stage) return '';
  const st = sel.stages[stage];
  if (!st || st.state !== 'waiting' || !st.promptId) return '';
  const promptId = st.promptId;
  const isReproduce = stage === 'reproduce';
  const key = sel.id + '__' + stage;
  const wcol = COLORS.waiting;

  // request.json (question + previewPath), cached per promptId.
  const req = requestCache.get(promptId);
  if (req === undefined) {
    // Momentary (request.json is written before the awaiting_approval event); fetch
    // and show a light placeholder — no actionable buttons until the pause is confirmed live.
    loadRequest(sel.id, stage, promptId).then(rerender);
    return `<div style="margin-bottom:16px;padding:14px 15px;border:1px solid ${wcol}55;border-radius:10px;background:${wcol}0e;font-size:12px;color:#5c6773">Loading approval…</div>`;
  }
  if (req === null || req.promptId !== promptId) {
    // request.json is GONE — the approval was already settled + cleaned up, or the
    // run ended. The stage is effectively resolved even though its last event is
    // still awaiting_approval (no settle event is emitted). Suppress the stale
    // controls; the next poll re-derives the stage out of "waiting". This also
    // covers reproduce's long post-approval window (headed scrape runs for minutes).
    return '';
  }

  // Live pause. "submitting…" is scoped to THIS promptId (a re-pause of the same
  // stage — reject→revise, or the review belt — mints a NEW promptId → fresh
  // buttons, never a frozen "submitting…") and time-boxed so a decision against a
  // dead run surfaces a retry hint instead of freezing forever.
  const SUBMIT_TIMEOUT_MS = 12000;
  const dec = state.decision[key] || {};
  const busyForThis = !!dec.busy && dec.promptId === promptId;
  const stale = busyForThis && (Date.now() - (dec.ts || 0) > SUBMIT_TIMEOUT_MS);
  const busy = busyForThis && !stale;
  const draft = state.feedbackDraft[key] || '';
  const rejecting = !!state.rejectOpen[key];

  const question = req.question ? String(req.question) : '';
  let previewHtml = '';
  if (!isReproduce && req.previewPath) {
    const pv = previewCache.get(promptId);
    if (pv === undefined) {
      loadPreview(promptId, req.previewPath).then(rerender);
      previewHtml = `<div style="padding:18px;text-align:center;color:#5c6773;font-size:12px">loading preview…</div>`;
    } else if (pv) {
      previewHtml = `<div style="max-height:56vh;overflow:auto;padding:2px 4px 6px">${parseMd(pv)}</div>`;
    }
  }

  const btn = (act, label, extra) =>
    `<button data-act="${act}" data-id="${esc(sel.id)}" data-stage="${esc(stage)}" data-prompt="${esc(promptId)}" style="${extra}">${esc(label)}</button>`;
  const approveStyle = `padding:7px 15px;border-radius:8px;border:1px solid ${COLORS.done}66;background:${COLORS.done}18;color:${COLORS.done};font-size:12.5px;font-weight:600;cursor:pointer`;
  const rejectStyle = `padding:7px 15px;border-radius:8px;border:1px solid ${COLORS.failed}55;background:${COLORS.failed}14;color:${COLORS.failed};font-size:12.5px;font-weight:600;cursor:pointer`;

  let controls;
  if (busy) {
    controls = `<span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:${wcol};animation:sdlcBlink 1.4s ease-in-out infinite">submitting…</span>`;
  } else if (isReproduce) {
    // reproduce: no feedback — Reject submits immediately.
    controls = btn('approve', 'Approve', approveStyle) + btn('reject-submit', 'Reject', rejectStyle);
  } else if (rejecting) {
    controls = `<div style="width:100%">
        <textarea data-fb="${esc(key)}" placeholder="Optional feedback for the agent…" rows="3" style="width:100%;box-sizing:border-box;resize:vertical;padding:8px 10px;background:#0c1016;border:1px solid #1c232c;border-radius:8px;color:#e6edf3;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:12.5px;line-height:1.5;outline:none">${esc(draft)}</textarea>
        <div style="display:flex;gap:9px;margin-top:8px">${btn('reject-submit', 'Submit rejection', rejectStyle)}</div>
      </div>`;
  } else {
    controls = btn('approve', 'Approve', approveStyle) + btn('reject-open', 'Reject…', rejectStyle);
  }

  const errMsg = stale
    ? `<div style="margin-top:9px;font-size:11.5px;color:${COLORS.failed}">No response yet — the run may have stopped. You can retry.</div>`
    : ((dec.msg && dec.promptId === promptId && !busy)
        ? `<div style="margin-top:9px;font-size:11.5px;color:${COLORS.failed}">${esc(dec.msg)}</div>`
        : '');

  return `<div style="margin-bottom:16px;padding:14px 15px;border:1px solid ${wcol}55;border-radius:10px;background:${wcol}0e">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px">
      <span style="width:8px;height:8px;border-radius:50%;background:${wcol};flex:0 0 auto;animation:sdlcPulse 1.5s ease-in-out infinite"></span>
      <span style="font-size:13px;font-weight:600;color:#e6edf3">Awaiting your approval</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8b98a5">${esc(st.label || stage)}</span>
    </div>
    ${question ? `<div style="font-size:12.5px;color:#c9d4de;margin-bottom:${previewHtml ? '10' : '12'}px">${esc(question)}</div>` : ''}
    ${previewHtml ? `<div style="border:1px solid #1c232c;border-radius:8px;background:#0c1016;padding:10px 12px;margin-bottom:12px">${previewHtml}</div>` : ''}
    <div style="display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap">${controls}</div>
    ${errMsg}
  </div>`;
}

// ---------- TICKET DETAIL ----------
// A synthetic ticket for a job that's been started but hasn't emitted any events
// yet (the initial `fetch` phase runs for a few seconds before run_started). Its
// shape matches deriveModel's ticket so every detail renderer works unchanged; the
// real ticket replaces it on the next poll once its first event lands.
function placeholderTicket(id) {
  // Mirror derive.mjs's "skipped" rule from config so a disabled stage (test/qa) or
  // the off learning tail shows OFF immediately, not a one-poll flash of a live-ish
  // 'todo' node. Falls back to all-todo when config hasn't loaded yet.
  const learnOn = !!(config && config.learning && config.learning.enabled);
  const skippedOf = (key) =>
    (config && config.stages && config.stages[key] && config.stages[key].enabled === false) ||
    ((key === 'retrospector' || key === 'curator-product') && config && !learnOn);
  const stages = {};
  for (const st of ALL_STAGES) {
    stages[st.key] = {
      key: st.key, label: st.label, gate: st.gate, planned: false,
      mode: 'auto', state: skippedOf(st.key) ? 'skipped' : 'todo', attempts: 0, durationMs: null,
      gateKind: null, gateSource: null, activeDetail: '',
    };
  }
  return {
    id, title: 'Starting…', branch: 'feature/' + id, product: productName,
    stages, status: 'running', current: STAGES[0].key,
    implAttempts: 0, beltLoops: 0, infraRetries: 0, doneCount: 0,
    activeStageCount: STAGES.filter(s => stages[s.key].state !== 'skipped').length,
    kbByStage: {}, timeline: [],
    lastTs: Date.now(), outcome: { text: 'Starting…', kind: 'running' }, ents: [],
  };
}

function renderDetail() {
  let sel = model.tickets.find(t => t.id === state.detailId);
  if (!sel && state.detailId) sel = placeholderTicket(state.detailId); // just-started job

    return `<div style="padding:40px;text-align:center;color:#5c6773">No job to show. <button data-act="back" style="background:none;border:none;color:#4f9dff;cursor:pointer">Back</button></div>`;
  }
  const sm = statusMeta(sel.status);
  const oCol = kindColor(sel.outcome.kind);

  prefetchAll(sel.id); // warm the artifact cache so stage modals open with content ready

  return `<div style="padding:18px 22px 40px;animation:sdlcFade .25s ease">
    <button data-act="back" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#8b98a5;background:none;border:none;cursor:pointer;padding:4px 0;margin-bottom:12px">← Back to jobs</button>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px">
      <div style="min-width:0">
        <div style="display:flex;align-items:center;gap:11px;flex-wrap:wrap">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:14px;color:#8b98a5">#${esc(sel.id)}</span>
          <h1 style="margin:0;font-size:19px;font-weight:600">${esc(sel.title)}</h1>
          <span style="${pill(sel.status)}">${esc(sm.label)}</span>

        <div style="display:flex;align-items:center;gap:14px;font-size:12px;color:#7d8892;margin-top:6px;flex-wrap:wrap">
          <span style="display:flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:2px;background:${PRODUCT_COLOR}"></span>${esc(productName)}</span>
          <span style="font-family:'IBM Plex Mono',monospace">${esc(sel.branch)}</span>
        </div>
      </div>
      <div style="flex:0 0 auto;text-align:right;padding:9px 15px;border-radius:10px;background:${oCol}14;border:1px solid ${oCol}44;color:${oCol}">
        <div style="font-size:10px;letter-spacing:.4px;text-transform:uppercase;opacity:.75">Outcome</div>
        <div style="font-size:14px;font-weight:600;margin-top:2px">${esc(sel.outcome.text)}</div>
      </div>
    </div>
    ${renderPipelineBar(sel)}
    ${renderContextPanel(sel)}
    ${renderConsole(sel)}
    ${renderStageModal(sel)}
  </div>`;
}

// Strip ANSI/VT escape sequences so raw color codes don't render as garbage in the
// <pre>. Child processes with piped (non-TTY) stdout usually suppress color already,
// but npm/claude occasionally slip some through.
function stripAnsi(s) { return s.replace(/\x1b\[[0-9;?]*[ -/]*[@-~]/g, ''); }

// The live console: the tail of logs/<id>.log for a dashboard-launched run — the
// pipeline streams here instead of a separate OS window. Read-only; only shown when
// there's captured output. The tail is capped for the DOM; the full log is on disk.
function renderConsole(sel) {
  const raw = state.consoleLog[sel.id] || '';
  // Always emit a node (a hidden placeholder when there's no log) so this section
  // never changes the detail's child COUNT. The index-based morph would otherwise
  // shift the sibling that follows — the stage modal — and rebuild it, dropping a
  // focused reject textarea / modal scroll on any transient logs/<id>.log fetch blip.
  if (!raw.trim()) return '<div style="display:none"></div>';
  const shown = stripAnsi(raw).slice(-200000);
  const active = sel.status === 'running' || sel.status === 'waiting';
  const dot = active
    ? `<span style="width:8px;height:8px;border-radius:50%;background:#22d3ee;flex:0 0 auto;animation:sdlcBlink 1.8s ease-in-out infinite"></span>`
    : `<span style="width:8px;height:8px;border-radius:50%;background:#4b5563;flex:0 0 auto"></span>`;
  return `<section style="margin-top:16px;background:#0b0f15;border:1px solid #1c232c;border-radius:12px;overflow:hidden">
    <div style="display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid #1c232c">
      ${dot}
      <span style="font-size:13px;font-weight:600">Live console</span>
      <span style="font-size:11.5px;color:#5c6773">${active ? 'streaming from the run' : 'last run'} · logs/${esc(sel.id)}.log</span>
    </div>
    <pre id="sdlcConsole" style="margin:0;max-height:360px;overflow:auto;padding:14px 16px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.55;color:#c9d4de;white-space:pre-wrap;word-break:break-word;background:#080b10">${esc(shown)}</pre>
  </section>`;
}

// The fetched debug context: the Mongo/Sentry evidence the pipeline started from,
// plus the prod error screenshot rendered inline (served under /data/context/<id>/).
function renderContextPanel(sel) {
  const ctx = contextCache.get(sel.id);
  const header = `<div style="padding:12px 16px;border-bottom:1px solid #1c232c;display:flex;align-items:baseline;gap:10px">
      <span style="font-size:13px;font-weight:600">Debug context</span>
      <span style="font-size:11.5px;color:#5c6773">the Mongo + Sentry evidence this job's fix started from</span>
    </div>`;
  let inner;
  if (ctx === undefined) {
    inner = `<div style="padding:16px;color:#5c6773;font-size:12px">loading…</div>`;
    loadContext(sel.id).then(rerender);
  } else if (!ctx) {
    inner = `<div style="padding:16px;color:#5c6773;font-size:12px">No fetched context — run <span style="font-family:'IBM Plex Mono',monospace;color:#c9d4de">npm run sdlc fetch ${esc(sel.id)}</span> (or <span style="font-family:'IBM Plex Mono',monospace;color:#c9d4de">debug</span>).</div>`;
  } else {
    const m = ctx.mongo || {};

      .join('<span style="color:#2a323d">·</span>');

    const errList = errs.length

    const open = !!state.shotsOpen[sel.id];
    const shots = imgs.length
      ? `<div style="margin-top:12px">
          <button data-act="toggleShots" style="display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid #1c232c;border-radius:8px;background:#0b0f15;cursor:pointer;color:#c9d4de;font-size:12px;font-family:inherit">

          </button>

          }).join('')}</div>` : ''}
        </div>`
      : `<div style="margin-top:10px;font-size:11.5px;color:#5c6773">No screenshot on the Sentry event for this job.</div>`;
    // The FULL fetched context.md (the human-readable Mongo+Sentry render the
    // investigate agent ingests) — folded away by default. This is the only place it's
    // viewable now that the artifact tabs are gone. Cache is warmed by prefetchAll.
    const ctxOpen = !!state.ctxOpen[sel.id];
    const ctxRec = artifactCache.get('context/' + sel.id);
    const fullCtx = `<div style="margin-top:12px;border-top:1px solid #12171d;padding-top:11px">
        <button data-act="toggleCtx" style="display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid #1c232c;border-radius:8px;background:#0b0f15;cursor:pointer;color:#c9d4de;font-size:12px;font-family:inherit">
          <span style="font-family:'IBM Plex Mono',monospace;color:#8b98a5">${ctxOpen ? '▾' : '▸'}</span>
          ${ctxOpen ? 'Hide' : 'Show'} full context
          <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:#7d8892;background:#12171d;border-radius:5px;padding:1px 6px">context.md</span>
        </button>
        ${ctxOpen ? `<div style="margin-top:10px;max-height:440px;overflow:auto;border:1px solid #1c232c;border-radius:8px;background:#0b0f15;padding:12px 15px;font-size:12.5px;line-height:1.6">${
          ctxRec && ctxRec.status === 'ok' ? parseMd(ctxRec.body) : `<span style="color:#5c6773;font-size:12px">${ctxRec ? 'context.md not produced yet.' : 'loading…'}</span>`

    inner = `<div style="padding:14px 16px">

  return `<section style="background:#0f141b;border:1px solid #1c232c;border-radius:12px;overflow:hidden;margin-top:16px">${header}${inner}</section>`;

// The KB-consultation summary for a job — which stages reached for the KB and the
// concept files they read. Returns just the rows; rendered inside a stage modal's
// "Knowledge base" tab (it used to be a standalone section on the detail page).
function renderKbContent(sel) {
  const entries = Object.entries(sel.kbByStage || {});
  if (!entries.length) {
    return `<div style="font-size:12px;color:#5c6773">No KB activity recorded for this job yet.</div>`;
  }
  return entries.map(([stageKey, info]) => {
    const st = STAGES.find(s => s.key === stageKey);
    // Learning-loop stages aren't in STAGES (they'd pollute the pipeline lane/
    // stats); give them friendly labels here instead of the raw event key.
    const KB_LABELS = { 'curator-product': 'Curator', retrospector: 'Retrospector' };
    const label = st ? st.label : (KB_LABELS[stageKey] || stageKey);
    const offered = !!info.offered;
    const reads = info.reads || [];
    const badgeCol = offered ? COLORS.done : '#5c6773';
    const badge = `<span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:1px 8px;border-radius:20px;color:${badgeCol};background:${badgeCol}1a;border:1px solid ${badgeCol}44">${offered ? 'offered' : 'not offered'}</span>`;
    let right;
    if (reads.length) {
      right = `<div style="display:flex;gap:6px;flex-wrap:wrap">${reads.map(f =>
        `<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:${ACCENT};background:${ACCENT}12;border:1px solid ${ACCENT}33;border-radius:5px;padding:2px 8px">${esc(f)}</span>`
      ).join('')}</div>`;
    } else {
      right = `<span style="font-size:11.5px;color:#6b7682">${offered ? 'offered, none read' : 'none read'}</span>`;
    }
    return `<div style="display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid #12171d">
      <span style="width:82px;flex:0 0 auto;font-size:12.5px;color:#dbe4ec;font-weight:500">${esc(label)}</span>
      <span style="flex:0 0 auto">${badge}</span>
      <div style="flex:1;min-width:0">${right}</div>
    </div>`;
  }).join('');
}

// The per-stage MODAL, opened by clicking a pipeline cube. Two tabs: "Output" (the
// stage's approval confirm, if it's paused, plus the artifact / post-step info it
// produced) and "Knowledge base" (the job's KB consultation — same content that used
// to be a standalone section). Lives inside #main so the 1.5s morph keeps it live.
function renderStageModal(sel) {
  const stageKey = state.modalStage;
  if (!stageKey) return '';
  const st = sel.stages[stageKey] || { state: 'todo', label: stageKey, durationMs: null, attempts: 0 };
  const label = st.label || stageKey;
  const scol = COLORS[st.state] || '#8b98a5';
  const stateLabel = STAGE_STATE_LABEL[st.state] || st.state;
  const tab = state.modalTab === 'kb' ? 'kb' : 'output';

  // --- Output tab: status strip + confirm + the stage's artifact (post-step info) ---
  const meta = [
    `<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:${scol};font-weight:600">${esc(stateLabel)}</span>`,
    st.attempts > 1 ? `<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#c084fc">×${st.attempts}</span>` : '',
    (st.state !== 'todo' && st.state !== 'skipped' && st.durationMs != null) ? `<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#6b7682">${esc(fmtDur(st.durationMs))}</span>` : '',
    st.activeDetail ? `<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:${COLORS.running}">▸ ${esc(st.activeDetail)}</span>` : '',
  ].filter(Boolean).join('<span style="color:#2a323d">·</span>');

  const tabKey = STAGE_TAB[stageKey];
  let artBody;
  if (!tabKey) {
    const note = stageKey === 'implement'
      ? 'This stage writes code in the product repo — no artifact is kept in the pipeline. See the feature branch and the review for what changed.'
      : (st.state === 'skipped' ? 'This stage is disabled in this run.' : 'This stage produces no local artifact.');
    artBody = `<div style="padding:22px 4px;color:#5c6773;font-size:12.5px">${esc(note)}</div>`;
  } else {
    const at = TABS.find(t => t.key === tabKey);
    const rec = artifactCache.get(at.key + '/' + sel.id);
    const relPath = at.path(sel.id).replace(/^\/data\//, '');
    if (!rec) {
      artBody = `<div style="padding:40px 20px;text-align:center;color:#5c6773;font-size:12.5px">loading…</div>`;
      loadArtifact(at, sel.id).then(rerender);
    } else if (rec.status === 'ok') {
      artBody = `<div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5c6773;margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed #1c232c">${esc(relPath)}</div><div>${parseMd(rec.body)}</div>`;
    } else {
      artBody = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:50px 20px;text-align:center">
        <span style="width:36px;height:36px;border-radius:9px;border:1px dashed #2a323d;display:flex;align-items:center;justify-content:center;color:#4a545f;font-size:18px">∅</span>
        <div style="font-size:13px;color:#8b98a5">Not produced yet</div>
        <div style="font-size:11.5px;color:#5c6773;max-width:280px">${esc(MISS_NOTE[tabKey] || '')}</div>
      </div>`;
    }
  }
  const outputBody = `${renderApproval(sel, stageKey)}${artBody}`;
  const body = tab === 'kb' ? renderKbContent(sel) : outputBody;

  const tabBtn = (key, text) => {
    const active = tab === key;
    return `<button data-act="modal-tab" data-tab="${key}" style="padding:9px 14px;border:none;border-bottom:2px solid ${active ? ACCENT : 'transparent'};background:none;cursor:pointer;font-size:12.5px;white-space:nowrap;color:${active ? '#e6edf3' : '#8b98a5'};font-weight:${active ? 600 : 400}">${esc(text)}</button>`;
  };

  // Which Claude model this stage runs on (per-stage config; blank = the CLI default).
  // Only the agent stages have a model — reproduce runs the scraper, qa is deterministic.
  const runsAgent = !['reproduce', 'qa'].includes(stageKey);
  const stageModel = (config && config.stages && config.stages[stageKey] && config.stages[stageKey].model) || 'default';
  const modelChip = runsAgent
    ? `<span title="Claude model this stage runs on" style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#c084fc;background:#1e1630;border:1px solid #3a2a55;border-radius:5px;padding:1px 8px;white-space:nowrap">model: ${esc(stageModel)}</span>`
    : '';

  return `<div data-act="modal-close" style="position:fixed;inset:0;z-index:120;background:rgba(6,9,13,.66);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px 16px">
    <div data-act="modal-stop" style="position:relative;width:min(1080px, 94vw);max-height:92vh;display:flex;flex-direction:column;background:#0e1218;border:1px solid #1c232c;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:sdlcFade .16s ease">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #1c232c;flex-wrap:wrap">
        <span style="width:10px;height:10px;border-radius:50%;background:${scol};flex:0 0 auto;animation:${dotAnim(st.state)}"></span>
        <span style="font-size:15px;font-weight:600;color:#f0f5fa">${esc(label)}</span>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:4px">${meta}</div>
        ${modelChip}
        <span style="flex:1"></span>
        <button data-act="modal-close" title="Close (Esc)" style="background:none;border:none;color:#5c6773;font-size:22px;line-height:1;cursor:pointer;padding:0 4px">×</button>
      </div>
      <div style="display:flex;align-items:center;gap:2px;padding:6px 10px 0;border-bottom:1px solid #1c232c">
        ${tabBtn('output', 'Output')}
        ${tabBtn('kb', 'Knowledge base')}
      </div>
      <div style="flex:1;min-height:0;padding:16px 20px;overflow:auto;font-size:13.5px;line-height:1.65">${body}</div>
    </div>
  </div>`;
}

// ---------- render orchestration ----------
function currentViewHtml() {
  switch (state.view) {
    case 'gates':         return renderGates();
    case 'observability': return renderObs();
    case 'detail':        return renderDetail();
    default:              return renderTickets(); // Jobs is the landing view
  }
}
// In-place DOM morph: patch the existing tree to match new HTML instead of
// replacing it wholesale. Wholesale innerHTML= restarts every CSS animation
// (the pulsing "running" dots, the belt dash) and reflows on EVERY poll during
// an active run — that was the flicker. Morphing keeps node identity, so
// animations stay continuous and scroll/hover/selection survive. Index-based
// (no keys) is fine for our deterministic render.
function setHtml(el, html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  patchChildren(el, tmp);
}
function patchChildren(from, to) {
  const f = [...from.childNodes], t = [...to.childNodes];
  const n = Math.min(f.length, t.length);
  for (let i = 0; i < n; i++) patchNode(f[i], t[i]);
  for (let i = t.length; i < f.length; i++) from.removeChild(f[i]);
  for (let i = f.length; i < t.length; i++) from.appendChild(t[i]); // moves node out of `to`
}
function patchNode(f, t) {
  if (f.nodeType !== t.nodeType || f.nodeName !== t.nodeName) { f.replaceWith(t); return; }
  if (f.nodeType === 3 || f.nodeType === 8) { if (f.nodeValue !== t.nodeValue) f.nodeValue = t.nodeValue; return; }
  const fa = f.attributes, ta = t.attributes;
  for (let i = fa.length - 1; i >= 0; i--) if (!t.hasAttribute(fa[i].name)) f.removeAttribute(fa[i].name);
  for (let i = 0; i < ta.length; i++) if (f.getAttribute(ta[i].name) !== ta[i].value) f.setAttribute(ta[i].name, ta[i].value);
  patchChildren(f, t);
}

function render() {
  renderTopStats();
  renderProduct();
  renderNav();
  renderDebugModal();
  renderAbort();
  renderPasswordBar();
  setHtml(document.getElementById('main'), currentViewHtml());
  syncConsole(); // after #main is patched, so the <pre> exists to re-pin
}

function computeSig() {
  const m = JSON.stringify({
    st: model.topStats, p: productName,
    t: model.tickets.map(t => [t.id, t.status, t.current, t.doneCount, t.beltLoops, t.timeline.length, t.lastTs, t.title, t.branch]),
    a: model.activity.length, g: model.gateResults.length,
  });
  // Live console (its length) + the portal-password prompt (its promptId) aren't in
  // the model, so fold them in or the poll wouldn't repaint as the log grows / the
  // prompt appears.
  const c = state.detailId ? (state.consoleLog[state.detailId] || '').length : 0;
  const pw = Object.keys(state.pwReq).map(k => k + ':' + (state.pwReq[k] && state.pwReq[k].promptId)).join(',');
  return [state.view, state.detailId, state.modalStage || '', state.modalTab, c, pw, m].join('|');
}
let lastSig = '';
function rerender() { lastSig = computeSig(); render(); }
function maybeRender() { if (computeSig() !== lastSig) rerender(); }

// ---------- events ----------
function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  const id = el.getAttribute('data-id');
  if (act === 'nav') { state.view = el.getAttribute('data-view'); rerender(); }
  else if (act === 'open') { openDetail(id); }
  else if (act === 'back') { state.view = 'tickets'; state.modalStage = null; rerender(); }
  else if (act === 'toggleShots') { state.shotsOpen[state.detailId] = !state.shotsOpen[state.detailId]; rerender(); }
  else if (act === 'toggleCtx') { state.ctxOpen[state.detailId] = !state.ctxOpen[state.detailId]; rerender(); }
  else if (act === 'stage') { openStageModal(el.getAttribute('data-stage')); }
  else if (act === 'modal-tab') { state.modalTab = el.getAttribute('data-tab'); rerender(); }
  else if (act === 'modal-close') { state.modalStage = null; rerender(); }
  else if (act === 'modal-stop') { /* click inside the modal card — swallow it */ }
  else if (act === 'debug-open') { openDebugModal(true); }
  else if (act === 'debug-close') { openDebugModal(false); }
  else if (act === 'debug-start') { debugStart(); }
  else if (act === 'abort') { abortRun(); }
  else if (act === 'pw-submit') { submitPassword(); }
  else if (act === 'approve') { submitDecision(el, 'approve'); }
  else if (act === 'reject-open') {
    const k = el.getAttribute('data-id') + '__' + el.getAttribute('data-stage');
    state.rejectOpen[k] = true;
    rerender();
  }
  else if (act === 'reject-submit') { submitDecision(el, 'reject'); }
}

// Start a run from the header box: client-validate the 24-hex jobId, POST it,
// and surface the outcome (202 clears the box; 409 = a run is already up).
let debugStarting = false;
async function debugStart() {
  if (debugStarting) return; // in-flight guard — a double-click must not spawn two consoles
  const jobId = (state.debugJobId || '').trim();
  if (!/^[a-f0-9]{24}$/i.test(jobId)) { state.debugMsg = 'Enter a valid 24-char job id.'; renderDebugModal(); return; }
  debugStarting = true;
  state.debugMsg = 'starting…'; renderDebugModal();
  try {
    const { status, json } = await postCommand({ cmd: 'start', jobId });
    if (status === 202) {
      // Jump straight into the job's detail view + live console — don't wait for its
      // first event to land (the fetch phase runs for a few seconds first). renderDetail
      // renders from a placeholder until the real ticket appears; the console starts
      // tailing logs/<id>.log immediately.
      state.debugMsg = ''; state.debugOpen = false;
      openDetail(jobId);
      state.debugJobId = '';
    }
    else if (status === 409) { state.debugMsg = 'a run is already in progress'; }
    else if (status === 0) { state.debugMsg = 'could not reach the server'; }
    else { state.debugMsg = (json && json.error) || ('error ' + status); }
  } finally {
    debugStarting = false;
    renderDebugModal();
  }
}

// Approve/reject a paused stage. Optimistic "submitting…"; the next 1.5s poll
// observes the stage leaving "waiting" and the whole block disappears.
async function submitDecision(el, decision) {
  const ticket = el.getAttribute('data-id');
  const stage = el.getAttribute('data-stage');
  const promptId = el.getAttribute('data-prompt');
  const key = ticket + '__' + stage;
  const cur = state.decision[key];
  if (cur && cur.busy && cur.promptId === promptId) return; // ignore double-clicks on THIS pause
  const body = { cmd: 'decision', ticket, stage, promptId, decision };
  if (decision === 'reject') body.feedback = state.feedbackDraft[key] || '';
  state.decision[key] = { busy: true, msg: '', promptId, ts: Date.now() };
  rerender();
  // Repaint after the optimistic-submit timeout so a decision nothing consumes
  // (dead/crashed run) recovers to a retry hint instead of a frozen "submitting…".
  setTimeout(rerender, 12300);
  const { status, json } = await postCommand(body);
  if (status === 200) {
    state.rejectOpen[key] = false;
    // stay "submitting…" — the poll re-derives the stage out of "waiting" once the
    // orchestrator consumes the decision (and the timeout above recovers if it can't).
  } else {
    let msg;
    if (status === 409) msg = (json && json.error) || 'no longer pending (already decided or stale)';
    else if (status === 0) msg = 'could not reach the server';
    else msg = (json && json.error) || ('error ' + status);
    state.decision[key] = { busy: false, msg, promptId };
    rerender();
  }
}
function openDetail(id) {
  state.detailId = id;
  state.view = 'detail';
  state.modalStage = null; // never carry an open stage modal across jobs
  prefetchAll(id);
  // Warm the artifact cache now so a stage modal opens with its output already loaded
  // (don't trust a possibly-stale cache from an earlier open).
  refreshOpenArtifacts(id).then(rerender);
  rerender();
}
// Open the per-stage modal from a clicked pipeline cube.
function openStageModal(stage) {
  if (!stage) return;
  state.modalStage = stage;
  state.modalTab = 'output';
  rerender(); // renderStageModal kicks off the artifact fetch if it isn't cached yet
}

// ============================================================================
//  BOOT
// ============================================================================
buildShell();
renderClock();
render();               // paint empty shell immediately
refresh();              // first data pull
setInterval(refresh, 1500);
setInterval(renderClock, 1000);
</script>
</body>
